<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মহা পেটুক বিল খাতা</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,"Noto Sans Bengali",sans-serif;
  background:#f5f7f8;
  color:#17202a
}

header{
  background:#087f5b;
  color:white;
  padding:18px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:2
}

h1,h2{
  margin:0 0 12px
}

.tabs{
  display:flex;
  gap:8px;
  padding:10px;
  background:white;
  position:sticky;
  top:73px;
  z-index:2
}

.tabs button{
  flex:1
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:14px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px
}

.card,.panel{
  background:white;
  border-radius:14px;
  padding:12px;
  box-shadow:0 2px 8px #0001
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:10px;
  background:#eee
}

.card button{
  width:100%;
  margin-top:8px
}

button{
  border:0;
  border-radius:9px;
  padding:10px 12px;
  background:#087f5b;
  color:white;
  font-weight:600;
  cursor:pointer
}

.secondary{
  background:#e8f3ef;
  color:#075c43
}

.danger{
  background:#c92a2a
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.row>*{
  flex:1
}

input,select{
  width:100%;
  padding:10px;
  border:1px solid #ccd5d2;
  border-radius:8px;
  margin:4px 0 10px
}

.cartline,.historyline{
  border-bottom:1px solid #eee;
  padding:10px 0
}

.muted{
  color:#68737a;
  font-size:.9em
}

.total{
  font-size:1.25em;
  font-weight:800;
  margin:12px 0
}

.hidden{
  display:none
}

.pill{
  display:inline-block;
  padding:4px 8px;
  border-radius:99px;
  background:#e8f3ef;
  color:#075c43;
  font-size:.8em
}
</style>
</head>

<body>

<header>
  <h1>মহা পেটুক বিল খাতা</h1>
  <div id="summary"></div>
</header>

<nav class="tabs">
  <button onclick="showSection('sell')">বিক্রি</button>
  <button onclick="showSection('history')">হিস্ট্রি</button>
  <button onclick="showSection('manage')">মেনু</button>
</nav>

<main class="wrap">

<section id="sell">

  <div class="grid" id="menuGrid"></div>

  <div class="panel" style="margin-top:14px">
    <h2>বর্তমান বিল</h2>

    <div id="cart"></div>

    <div class="total" id="cartTotal">
      মোট: ₹0
    </div>

    <div class="row">
      <button onclick="completeSale('cash')">ক্যাশ</button>
      <button onclick="completeSale('online')">অনলাইন</button>
      <button class="secondary" onclick="clearCart()">খালি করুন</button>
    </div>
  </div>

</section>

<section id="history" class="hidden">

  <div class="panel">
    <h2>বিক্রির হিস্ট্রি</h2>

    <div class="row">
      <input
        type="date"
        id="dateFilter"
        onchange="renderHistory()"
      >

      <button
        class="secondary"
        onclick="clearDateFilter()"
      >
        সব
      </button>

      <button onclick="backupData()">
        ব্যাকআপ
      </button>

      <button
        class="secondary"
        onclick="document.getElementById('restoreFile').click()"
      >
        রিস্টোর
      </button>

      <input
        id="restoreFile"
        type="file"
        accept="application/json"
        class="hidden"
        onchange="restoreData(event)"
      >
    </div>

    <div id="historyList"></div>
  </div>

</section>

<section id="manage" class="hidden">

  <div class="panel">

    <h2 id="formTitle">খাবার যোগ করুন</h2>

    <input type="hidden" id="editId">

    <label>খাবারের নাম</label>
    <input
      id="foodName"
      placeholder="যেমন: বিরিয়ানি"
    >

    <div class="row">
      <div>
        <label>হাফ দাম</label>
        <input
          id="halfPrice"
          type="number"
          min="0"
          placeholder="0"
        >
      </div>

      <div>
        <label>ফুল দাম</label>
        <input
          id="fullPrice"
          type="number"
          min="0"
          placeholder="0"
        >
      </div>
    </div>

    <label>ছবির path বা URL</label>
    <input
      id="foodImage"
      placeholder="images/biryani.jpg"
    >

    <div class="row">
      <button onclick="saveFood()">সেভ করুন</button>
      <button
        class="secondary"
        onclick="resetFoodForm()"
      >
        রিসেট
      </button>
    </div>

  </div>

  <div
    class="grid"
    id="manageGrid"
    style="margin-top:14px"
  ></div>

</section>

</main>

<script>

const STORAGE_KEY = "mahaPetukOfflineBilling";

let database =
  JSON.parse(localStorage.getItem(STORAGE_KEY)) ||
  {
    menu: [
      {
        id: 1,
        name: "বিরিয়ানি",
        halfPrice: 100,
        fullPrice: 180,
        image: ""
      },
      {
        id: 2,
        name: "চাউমিন",
        halfPrice: 60,
        fullPrice: 100,
        image: ""
      }
    ],
    sales: []
  };

let cart = [];

function saveDatabase(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(database)
  );
}

function money(amount){
  return "₹" + Number(amount || 0).toFixed(0);
}

function placeholderImage(){
  return "data:image/svg+xml," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="400"
           height="250">
        <rect width="100%" height="100%" fill="#e8efed"/>
        <text x="50%" y="55%"
              text-anchor="middle"
              font-size="42">
          🍽️
        </text>
      </svg>
    `);
}

function getImage(image){
  return image && image.trim()
    ? image
    : placeholderImage();
}

function showSection(sectionId){

  ["sell","history","manage"].forEach(id=>{
    document
      .getElementById(id)
      .classList.toggle("hidden", id !== sectionId);
  });

  if(sectionId === "history"){
    renderHistory();
  }

  if(sectionId === "manage"){
    renderManage();
  }
}

function renderMenu(){

  const menuGrid =
    document.getElementById("menuGrid");

  if(!database.menu.length){
    menuGrid.innerHTML =
      "<p>মেনু খালি। মেনু ট্যাব থেকে খাবার যোগ করুন।</p>";
    return;
  }

  menuGrid.innerHTML =
    database.menu.map(food => `
      <div class="card">

        <img
          src="${getImage(food.image)}"
          alt="${food.name}"
        >

        <h3>${food.name}</h3>

        <div class="row">
          <button
            onclick="addToCart(${food.id}, 'half')"
          >
            হাফ ${money(food.halfPrice)}
          </button>

          <button
            onclick="addToCart(${food.id}, 'full')"
          >
            ফুল ${money(food.fullPrice)}
          </button>
        </div>

      </div>
    `).join("");
}

function addToCart(foodId, size){

  const food =
    database.menu.find(item => item.id === foodId);

  if(!food){
    return;
  }

  const price =
    size === "half"
      ? food.halfPrice
      : food.fullPrice;

  const existing =
    cart.find(item =>
      item.foodId === foodId &&
      item.size === size
    );

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      foodId: food.id,
      name: food.name,
      size,
      price,
      quantity: 1
    });
  }

  renderCart();
}

function renderCart(){

  const cartElement =
    document.getElementById("cart");

  const totalElement =
    document.getElementById("cartTotal");

  if(!cart.length){

    cartElement.innerHTML =
      '<p class="muted">কোনো খাবার নির্বাচিত হয়নি।</p>';

    totalElement.textContent = "মোট: ₹0";
    return;
  }

  cartElement.innerHTML =
    cart.map((item,index)=>`

      <div class="cartline">

        <b>${item.name}</b>

        <span class="pill">
          ${item.size === "half" ? "হাফ" : "ফুল"}
        </span>

        <div class="row">

          <span>
            ${money(item.price)}
            × ${item.quantity}
            =
            ${money(item.price * item.quantity)}
          </span>

          <button
            onclick="increaseQuantity(${index})"
          >
            +
          </button>

          <button
            class="secondary"
            onclick="decreaseQuantity(${index})"
          >
            −
          </button>

        </div>

      </div>

    `).join("");

  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.price * item.quantity,
      0
    );

  totalElement.textContent =
    "মোট: " + money(total);
}

function increaseQuantity(index){
  cart[index].quantity++;
  renderCart();
}

function decreaseQuantity(index){

  cart[index].quantity--;

  if(cart[index].quantity <= 0){
    cart.splice(index,1);
  }

  renderCart();
}

function clearCart(){
  cart = [];
  renderCart();
}

function completeSale(paymentMethod){

  if(!cart.length){
    alert("আগে খাবার নির্বাচন করুন");
    return;
  }

  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.price * item.quantity,
      0
    );

  const sale = {
    id: Date.now(),
    billNumber:
      "MP-" +
      String(database.sales.length + 1)
        .padStart(5,"0"),

    items: cart.map(item => ({
      ...item
    })),

    total,
    paymentMethod,
    createdAt: new Date().toISOString()
  };

  database.sales.unshift(sale);

  saveDatabase();

  clearCart();

  renderSummary();

  alert("বিল সেভ হয়েছে\n" + sale.billNumber + "\nমোট: " + money(total));
}

function renderSummary(){

  const today =
    new Date().toISOString().slice(0,10);

  const todaySales =
    database.sales.filter(sale =>
      sale.createdAt.slice(0,10) === today
    );

  const total =
    todaySales.reduce(
      (sum,sale) =>
        sum + sale.total,
      0
    );

  document.getElementById("summary").textContent =
    `আজ: ${todaySales.length} বিল · মোট ${money(total)}`;
}

function renderHistory(){

  const filterDate =
    document.getElementById("dateFilter").value;

  const historyList =
    document.getElementById("historyList");

  const sales =
    database.sales.filter(sale =>
      !filterDate ||
      sale.createdAt.slice(0,10) === filterDate
    );

  if(!sales.length){
    historyList.innerHTML =
      '<p class="muted">কোনো রেকর্ড নেই।</p>';
    return;
  }

  historyList.innerHTML =
    sales.map(sale => `

      <div class="historyline">

        <b>${sale.billNumber}</b>
        ·
        ${new Date(sale.createdAt).toLocaleString("bn-IN")}

        <br>

        ${sale.items.map(item => `
          ${item.name}
          (${item.size === "half" ? "হাফ" : "ফুল"})
          × ${item.quantity}
        `).join(", ")}

        <br>

        <b>${money(sale.total)}</b>
        ·
        ${sale.paymentMethod === "cash"
          ? "ক্যাশ"
          : "অনলাইন"}

        <br>

        <button
          class="danger"
          onclick="deleteSale(${sale.id})"
        >
          মুছুন
        </button>

      </div>

    `).join("");
}

function clearDateFilter(){

  document.getElementById("dateFilter").value = "";

  renderHistory();
}

function deleteSale(saleId){

  if(!confirm("এই বিলটি মুছবেন?")){
    return;
  }

  database.sales =
    database.sales.filter(
      sale => sale.id !== saleId
    );

  saveDatabase();

  renderHistory();
  renderSummary();
}

function renderManage(){

  const manageGrid =
    document.getElementById("manageGrid");

  if(!database.menu.length){
    manageGrid.innerHTML =
      "<p>এখনও কোনো খাবার যোগ করা হয়নি।</p>";
    return;
  }

  manageGrid.innerHTML =
    database.menu.map(food => `

      <div class="card">

        <img
          src="${getImage(food.image)}"
          alt="${food.name}"
        >

        <h3>${food.name}</h3>

        <p>
          হাফ ${money(food.halfPrice)}
          ·
          ফুল ${money(food.fullPrice)}
        </p>

        <div class="row">

          <button
            onclick="editFood(${food.id})"
          >
            এডিট
          </button>

          <button
            class="danger"
            onclick="deleteFood(${food.id})"
          >
            মুছুন
          </button>

        </div>

      </div>

    `).join("");
}

function saveFood(){

  const name =
    document.getElementById("foodName")
      .value.trim();

  const halfPrice =
    Number(
      document.getElementById("halfPrice").value
    ) || 0;

  const fullPrice =
    Number(
      document.getElementById("fullPrice").value
    ) || 0;

  const image =
    document.getElementById("foodImage")
      .value.trim();

  const editId =
    Number(
      document.getElementById("editId").value
    );

  if(!name){
    alert("খাবারের নাম দিন");
    return;
  }

  if(editId){

    const food =
      database.menu.find(
        item => item.id === editId
      );

    if(food){

      food.name = name;
      food.halfPrice = halfPrice;
      food.fullPrice = fullPrice;
      food.image = image;
    }

  }else{

    database.menu.push({
      id: Date.now(),
      name,
      halfPrice,
      fullPrice,
      image
    });
  }

  saveDatabase();

  resetFoodForm();
  renderManage();
  renderMenu();

  alert("খাবারের তথ্য সেভ হয়েছে");
}

function editFood(foodId){

  const food =
    database.menu.find(
      item => item.id === foodId
    );

  if(!food){
    return;
  }

  document.getElementById("editId").value =
    food.id;

  document.getElementById("foodName").value =
    food.name;

  document.getElementById("halfPrice").value =
    food.halfPrice;

  document.getElementById("fullPrice").value =
    food.fullPrice;

  document.getElementById("foodImage").value =
    food.image;

  document.getElementById("formTitle").textContent =
    "খাবার পরিবর্তন করুন";

  showSection("manage");
}

function deleteFood(foodId){

  if(!confirm("এই খাবারটি মুছবেন?")){
    return;
  }

  database.menu =
    database.menu.filter(
      food => food.id !== foodId
    );

  saveDatabase();

  renderManage();
  renderMenu();
}

function resetFoodForm(){

  document.getElementById("editId").value = "";
  document.getElementById("foodName").value = "";
  document.getElementById("halfPrice").value = "";
  document.getElementById("fullPrice").value = "";
  document.getElementById("foodImage").value = "";

  document.getElementById("formTitle").textContent =
    "খাবার যোগ করুন";
}

function backupData(){

  const file =
    new Blob(
      [JSON.stringify(database,null,2)],
      {type:"application/json"}
    );

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(file);

  link.download =
    "maha-petuk-backup.json";

  link.click();

  URL.revokeObjectURL(link.href);
}

function restoreData(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(){

    try{

      const restored =
        JSON.parse(reader.result);

      if(!restored.menu || !restored.sales){
        throw new Error("Invalid backup");
      }

      database = restored;

      saveDatabase();

      render();
      renderHistory();

      alert("ব্যাকআপ রিস্টোর হয়েছে");

    }catch(error){

      alert("ভুল backup file");
    }
  };

  reader.readAsText(file);
}

function render(){

  renderMenu();
  renderCart();
  renderSummary();
}

render();

</script>

</body>
</html>
