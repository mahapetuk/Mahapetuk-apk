name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Project Files
        run: |
          mkdir -p app/src/main/java/com/billkhata/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          [ -f index.html ] && cp index.html app/src/main/assets/
          [ -f MainActivity.java ] && cp MainActivity.java app/src/main/java/com/billkhata/app/
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/

          cat << 'EOF' > settings.gradle
          rootProject.name = "BillKhata"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.billkhata.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.billkhata.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahaPetuk-BillKhata-APK
          path: app/build/outputs/apk/debug/app-debug.apk
