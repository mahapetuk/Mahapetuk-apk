name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/billkhata/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # কোড ফাইল ঠিকমতো রাখা
          [ -f index.html ] && cp index.html app/src/main/assets/
          [ -f MainActivity.java ] && cp MainActivity.java app/src/main/java/com/billkhata/app/
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/

          # strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">মহা পেটুক</string>
          </resources>
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BillKhata"
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          # App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.billkhata.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.billkhata.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Setup and Run Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahaPetuk-BillKhata-APK
          path: app/build/outputs/apk/debug/app-debug.apk
